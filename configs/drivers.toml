# Phase 2: the drivers. Settings every profile shares; each profile's own are in profiles/<name>.toml, and the
# machine's (batch of races, replay size, how often to eval) in [preset.<name>].

[tqc]                       # the brain (f1sim.tqc.TQCConfig); d, H0 and gamma are per profile
critics = 5                 # N
quantiles = 25              # M: 125 atoms
lr = 3e-4                   # actor, critics and alpha
batch = 256
tau = 0.005
n_step = 5
actor_hidden = [256, 256, 256]          # one more layer each since 2026-11-05 (older checkpoints load deepened:
critic_hidden = [512, 512, 512, 512]    # identity layers, the same driver)
init_alpha = 1.0

[encoder]                   # every network's input branches (f1sim.nets.EncoderSpec)
conv = [[32, 5, 2], [64, 3, 2]]    # lidar: (filters, width, stride) along the 50 beams, 3 channels
other_hidden = [128]               # the other ~59 inputs

[rewards]                   # base values per unit (f1sim.drivers.rewards); profiles multiply the style terms
scale = 0.1                 # the weighted sum x this: the critics see a crash as -250, a step at reference pace +0.1
progress = 1.0              # per step's worth of reference pace (the lap simulation's speed there, or the limit)
crash = -2500.0             # the full cost for every car in a contact crash, the one hit too (since 2026-11-05; was
                            # -100 by blame: the drivers took ~6 points more crash risk per lap for +1% of pace)
black_flag = -2500.0        # disqualified (the 4th warning): as much as a crash, so never a cheaper way out
sector = 10.0               # each third of a lap driven on the track, once
sc_close = -5.0             # per second closer than 0.5 s behind the car ahead with the safety car called or out
warning = -2500.0           # x 0.25 / 0.5 / 0.75 for the 1st / 2nd / 3rd warning (since 2026-11-06; was -50 each):
                            # with the 4th's black flag a disqualification costs 250% of a crash
bump = -2.0
pit = 5.0                   # entering the pit lane on a call
dead_tyre = -2.0            # per second on a dead tyre
finish = 50.0
off_track = -2.0            # per second with the car's centre off the track (its progress doesn't count either)
overtake = 20.0             # per place, held 2 s
place_lost = -25.0          # per place (was -20)
holding = 1.0               # per second, under attack
inside_line = 2.0           # per second
tyre_wear = -10.0           # per % of tyre life beyond the compound's rated wear
inputs = -0.05              # per unit of steer + throttle + brake change in a step
slip = -0.5                 # per unit of wheelspin + lock-up + sliding past the tyres' peak in a step (was -0.2,
                            # without sliding: the trained drivers drifted, the rear past its peak 19% of cornering)
quali_place = 1.0           # qualifying, per standing point: 21 for P1 down to 0 for P22, paid as the standing changes
quali_q2 = 3.0              # qualifying: in the top 16 (would move on to Q2)
quali_q3 = 5.0              # qualifying: in the top 10 (would move on to Q3)
quali_lap = 3.0             # qualifying: each new personal best lap, the first time included
standstill = -20.0          # per second stopped (under 1 m/s) on the track, unless queuing behind a moving car

[env]                       # the races (f1sim.drivers.env.EnvConfig)
min_laps = 5
race_km = 305.0
pit_share = 0.5             # at least half the races need a pit stop
pit_km = 180.0              # a first set can't do more (mediums 200 km nominal, boxed at ~10%)
time_factor = 2.5           # a race is cut at this x its lap-simulation time (bootstrapped)
worn = [0.08, 0.12]         # the principal boxes each stint at this tyre life
respawn = false             # a crashed car is out for the rest of its race (true: it rejoins from the pit exit after
                            # ~5 s as a new episode); off since 2026-11-01, so a crash isn't just a short setback

[stage_a]                   # alone, one car per race, on the track-width curriculum
widths = ["26", "20", "normal"]    # m; "normal" is the 12-15 m tracks
patience = 3                # evals without a better eval before moving on to the next width
warmup = 10_000             # transitions before the first update: random actions, or the policy when starting from another profile

[stage_b]                   # the full grid, the four profiles learning together
per_profile = 4             # learning cars per profile: 16 of 22, the other 6 (27%) frozen snapshots
snapshots = 8               # frozen snapshot pool: starts with the stage A bests
snapshot_every = 100_000    # environment steps between copies of a profile's actor into the pool (in turn)
quali_share = 0.2           # sessions that are short qualifying sessions
quali_s = 720.0             # their length (Q3's 12 minutes), two runs each
warmup_steps = 2_000        # environment steps before the first update (the replay fills with this run's driving)
critic_warmup = 30_000      # gradient steps on the critics alone first (the actor and alpha wait), so the critics
                            # learn this run's rewards before the driver follows them
store_share = 0.25          # learning seats stored in the replay (a quarter: the same buffer covers 4x the time)
eval_reference = "runs/reference/middle-together-250k.npz"   # the eval's fixed field in the odd cars ("none": off): a
                            # driver that has raced in traffic (stage A's best crashed on lap 1 in 89-98% of its cars)
solo_laps = 20              # each eval also runs every profile alone on the eval tracks for this many laps
field_sizes = [6, 12, 18, 22] # cars per session, one drawn per session (the learning seats keep their 16/22 share):
                            # fewer cars, fewer pile-ups; v2 trained on 3-car races (since 2026-11-06; was always 22)
spread_share = 0.5          # races that start with the cars spread around the lap at speed (the rest: on the grid),
spread_speed = [0.6, 0.9]   # ... each at this x the reference pace where it starts: racing without a lap-1 pile-up
entropy_shift = -5.0        # each profile's target entropy (H0) in stage B is this much lower: less action noise, so
                            # training drives closer to the noise-free eval (at -1 together5's noisy learners crashed
                            # 3-5x as often per lap as frozen copies of their start driving the mean action)

[preset.laptop]             # RTX 3050 Ti, 4 GB (the trainers let JAX use 92%, ~3.4 GB): stage A peaks at ~2.8 GB in use
races = 64                  # stage A: one car per race; a step costs about the same for 8 or 256 races
replay = 2_000_000          # transitions (~0.43 KB each)
tracks = 20                 # training tracks in a set; two sets on the GPU (~24 MB a track); 32 ran out after an hour
rotate_every = 100_000      # environment steps between fresh sets of tracks, so a run works through the pool
chunk = 1000                # environment steps per jitted call (and per log line)
updates = 1                 # gradient steps per environment step
eval_every = 50_000         # environment steps (stage A)
eval_every_b = 50_000       # stage B: a full weekend per eval track (Q1-Q3, then the race)
eval_laps = 50              # every eval race
eval_seeds = 1
steps_per_width = 400_000   # at most, environment steps
races_b = 16                # stage B: races per batch (x 22 cars), 64 learning cars per profile
replay_b = 500_000          # stage B: per profile (four of them)
steps_b = 200_000

[preset.cluster]            # the real runs
races = 64
replay = 1_000_000
tracks = 200
rotate_every = 250_000
chunk = 1000
updates = 1
eval_every = 50_000
eval_every_b = 100_000
eval_laps = 50
eval_seeds = 2
steps_per_width = 5_000_000
races_b = 64                # ~1,400 cars per step
replay_b = 1_000_000
steps_b = 5_000_000
